[project]
name = "karen-ai-service"
version = "0.1.0"
description = "KAREN AI orchestration service: ModelRouter, OpenRouter gateway client, LangGraph agents, evals."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx2==2.16.0",
    "openai==3.45.0",
    "langgraph==1.2.19",
    "pyyaml==6.0.3",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "sentry-sdk==2.73.0",
    "redis==8.1.0",  # shared atomic AI budget + internal-auth replay cache (ADR-0013)
    # Deepgram streaming STT client (ADR-0027). Already locked via uvicorn[standard]; now direct.
    "websockets==17.4",
]

[project.scripts]
karen-ai-dev = "karen_ai.cli:dev"
karen-ai-serve = "karen_ai.cli:serve"
karen-ai-probe = "karen_ai.gateway.probe:main"  # manual SP-1 live probe; never run in tests/CI
karen-ai-speech-probe = "karen_ai.speech.probe:main"  # manual paid Deepgram probe; never run in tests/CI
karen-ai-voice-catalog = "karen_ai.speech.catalog_tool:main"  # free public catalog read; writes the voice catalog

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261103",
]

[tool.uv]
# Supply-chain hygiene: resolve only releases at least ~2 weeks old (direct AND transitive).
exclude-newer = "2026-11-05T00:00:00Z"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "karen_ai"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RET", "PT", "ASYNC",
    "BLE", "T20", "RUF", "PL", "TID", "ERA",
]
ignore = [
    "PLR0913", # explicit keyword-only constructors are clearer than parameter objects here
    "PLR2004", # magic values are fine in focused checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"src/karen_ai/cli.py" = ["T201"]
# Prompts are prose: wrapping lines would change the text the model sees.
"src/karen_ai/prompts/catalog.py" = ["E501"]
"src/karen_ai/evaluation/run_golden.py" = ["T201"]
"src/karen_ai/observability/telemetry.py" = ["PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = ["integration: needs real local infrastructure (pnpm infra:up); run with -m integration"]
filterwarnings = ["error::DeprecationWarning:karen_ai.*"]
