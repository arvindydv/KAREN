packages:
  - 'apps/*'
  - 'packages/*'
  # Python services (ai-service, voice-agent) are managed by uv, not pnpm.
  - '!apps/ai-service'
  - '!apps/voice-agent'

# Supply-chain hygiene: only these packages may run install scripts.
onlyBuiltDependencies:
  - '@prisma/engines'
  - 'prisma'
  - '@swc/core'
  - 'esbuild'
  - 'sharp'
  - 'unrs-resolver'
  - '@temporalio/core-bridge'
  - 'protobufjs'

# Refuse to install releases published less than 7 days ago (minutes).
minimumReleaseAge: 10080

# Security overrides for transitive dependencies (each must name the advisory and be removed
# once the parent package ships a fixed range).
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS, high) via prisma -> @prisma/config -> effect@3.20.0.
  # 3.22.4 (published 2026-10-22) satisfies the 7-day release-age policy.
  'effect@<3.22.1': '3.22.4'
