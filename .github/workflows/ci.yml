name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typescript:
    name: TypeScript — format, lint, typecheck, unit tests, build, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:env-public
      - name: Migration safety gate (explicit transactions)
        run: pnpm check:migrations
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (Vitest → JUnit per package)
        run: pnpm turbo run test --filter='!@karen/mobile' -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Unit tests (mobile, Jest)
        run: pnpm --filter @karen/mobile test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-typescript
          path: |
            apps/*/test-results/junit.xml
            packages/*/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm build
      - name: OpenAPI contract drift
        run: pnpm contracts:check

  integration:
    name: Integration — PostgreSQL/pgvector, Redis, Temporal, migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local infrastructure (same compose file developers use)
        run: docker compose up -d --wait postgres redis temporal
      - name: Apply migrations from scratch (reproducibility)
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://karen:karen_local_only@localhost:5442/karen
      - name: Schema ↔ migrations drift check
        run: pnpm --filter @karen/api db:migrate:diff
        env:
          DATABASE_URL: postgresql://karen:karen_local_only@localhost:5442/karen
          SHADOW_DATABASE_URL: postgresql://karen:karen_local_only@localhost:5442/karen_shadow
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned: an unpinned (latest) uv changed `--project` resolution and broke CI.
          version: '0.9.10'
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/ai-service
      - run: pnpm test:integration
      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose logs --tail=200

  web-e2e:
    name: Web — Playwright smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@karen/web^...
      - run: pnpm --filter @karen/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  mobile:
    name: Mobile — Expo config + JS bundle (iOS/Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@karen/mobile^...
      - run: pnpm --filter @karen/mobile config:check
      - run: pnpm --filter @karen/mobile export:check

  python:
    name: Python — ${{ matrix.app }} (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [ai-service, voice-agent]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned: an unpinned (latest) uv changed `--project` resolution and broke CI.
          version: '0.9.10'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Golden-case eval harness (mock gateway — routing checks only)
        if: matrix.app == 'ai-service'
        run: uv run python -m karen_ai.evaluation.run_golden ../../evals/golden-cases

  terraform:
    name: Terraform — fmt, validate, offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
      - run: node scripts/terraform-validate.mjs

  security:
    name: Security — secret scan + dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm dependency audit (high+)
        run: pnpm audit --audit-level high --prod
      - run: pnpm install --frozen-lockfile
      - name: License gate (production dependencies)
        run: pnpm check:licenses
      - name: SBOM (CycloneDX, from lockfiles)
        run: |
          mkdir -p sbom
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sbom:/out" \
            anchore/syft:v1.57.1@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 \
            scan dir:/src --exclude './**/node_modules/**' --exclude './**/.venv/**' \
            -o cyclonedx-json=/out/karen.cdx.json -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom/karen.cdx.json
          retention-days: 90
      - name: OSV scan of all lockfiles (pnpm + uv)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.2.4 scan source --config /src/osv-scanner.toml \
            --lockfile /src/pnpm-lock.yaml \
            --lockfile /src/apps/ai-service/uv.lock \
            --lockfile /src/apps/voice-agent/uv.lock

  containers:
    name: Container build — ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: api,
              file: infra/docker/node-service.Dockerfile,
              args: 'APP=api HEALTH_PORT=4100',
              context: .,
            }
          - {
              name: api-migrate,
              file: infra/docker/node-service.Dockerfile,
              args: 'APP=api HEALTH_PORT=4100',
              context: .,
              target: migrate,
            }
          - {
              name: temporal-worker,
              file: infra/docker/node-service.Dockerfile,
              args: 'APP=temporal-worker HEALTH_PORT=4300',
              context: .,
            }
          - {
              name: provider-worker,
              file: infra/docker/node-service.Dockerfile,
              args: 'APP=provider-worker HEALTH_PORT=4200',
              context: .,
            }
          - {
              name: web,
              file: infra/docker/nextjs.Dockerfile,
              args: 'APP=web NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid',
              context: .,
            }
          - {
              name: admin,
              file: infra/docker/nextjs.Dockerfile,
              args: 'APP=admin NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid',
              context: .,
            }
          - {
              name: ai-service,
              file: apps/ai-service/Dockerfile,
              args: '',
              context: apps/ai-service,
            }
          - {
              name: voice-agent,
              file: apps/voice-agent/Dockerfile,
              args: '',
              context: apps/voice-agent,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        env:
          BUILD_ARGS: ${{ matrix.args }}
          DOCKERFILE: ${{ matrix.file }}
          CONTEXT: ${{ matrix.context }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target || '' }}
        run: |
          args=()
          for a in $BUILD_ARGS; do args+=(--build-arg "$a"); done
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker buildx build --load -f "$DOCKERFILE" "${args[@]}" -t "karen/$NAME:ci" "$CONTEXT"
